# Alembic configuration. Two branch labels in one versions directory:
#   alembic upgrade foundation@head
#   alembic upgrade iteration@head
# The database URL is never written here; backend/alembic/env.py reads it
# through backend/config/settings_env.py (CLAUDE.md Law 10).
[alembic]
script_location = backend/alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
