# test_dataset.yaml — TEST DATA for trying the site. Not real residents, not real opinions.
# Written by the planning session 2026-09-19 (change/01); the director may edit freely.
#
# Loaded by   backend/scripts/load_test_data.py    (refuses unless ALLOW_TEST_DATA=true)
# Removed by  backend/scripts/remove_test_data.py  (same guard)
#
# HOW TEST DATA IS IDENTIFIED — three marks, all required:
#   1. every test account's email is <key>@test.example.com  (TEST_DATA_EMAIL_DOMAIN; signup refuses this domain)
#   2. every test account's display name and real name start with "[TEST] "
#   3. everything a test account authored is test data; the remover deletes by author
#
# VOTING RULE (so this file stays short and the result is deterministic):
#   up: N    -> the first N test accounts, in key order, that are members of that community,
#               excluding the author, upvote the solution
#   down: M  -> the next M accounts after those downvote it
#
# file_under: per governance level of the AUTHOR's home, either an existing umbrella name
#   (recorded as author_selected) or the word  ai  (the labeler decides — exercises Ollama).
# Posts load in file order, so the last post in this file is the newest on Home.
# comments: target "solution" (solution 1 of the post; only used where the solution will be dominant)
#   or target "umbrella" (the problem discussion of the umbrella the post was filed under).

