[project]
name = "direct-democracy-ca"
version = "0.1.0"
description = "Direct Democracy CA — civic engagement platform (Demo 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "bcrypt",
    "pyjwt",
    "httpx",
    "redis",
    "pydantic[email]>=2",
    "pydantic-settings",
    "PyYAML",
    "python-multipart",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "psycopg[binary]", "fakeredis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
markers = [
    "live: hits the real Ollama; opt in with -m live",
]
# The live checks are opt-in: `pytest -m live` (ARCHITECTURE.md §10).
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
